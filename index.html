<meta charset="utf-8">
<title>Sketch2AI</title>
<style>
  :root {
    --bg: #eceef2; --panel: #ffffff; --ink: #191d24; --muted: #626a76;
    --line: #d5d9e0; --line-strong: #c2c8d1; --accent: #ff4d2e; --accent-ink: #ffffff;
    --sheet: #ffffff; --grid: #d9dde3; --good: #1f9d55;
    --shadow: 0 1px 2px rgba(20,23,28,.06), 0 8px 24px rgba(20,23,28,.08); --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --panel: #1c2028; --ink: #e7eaef; --muted: #99a1ad;
      --line: #2b313b; --line-strong: #3a4250; --accent: #ff6a4d; --accent-ink: #1a1005;
      --sheet: #ffffff; --grid: #e0e3e8; --good: #46c07a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171c; --panel: #1c2028; --ink: #e7eaef; --muted: #99a1ad;
    --line: #2b313b; --line-strong: #3a4250; --accent: #ff6a4d; --accent-ink: #1a1005;
    --sheet: #ffffff; --grid: #e0e3e8; --good: #46c07a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.4);
  }
  :root[data-theme="light"] {
    --bg: #eceef2; --panel: #ffffff; --ink: #191d24; --muted: #626a76;
    --line: #d5d9e0; --line-strong: #c2c8d1; --accent: #ff4d2e; --accent-ink: #ffffff;
    --sheet: #ffffff; --grid: #d9dde3; --good: #1f9d55;
    --shadow: 0 1px 2px rgba(20,23,28,.06), 0 8px 24px rgba(20,23,28,.08);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  }
  .rail {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 9px 14px; background: var(--panel);
    border-bottom: 1px solid var(--line); box-shadow: var(--shadow); z-index: 5;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; margin-right: 2px; }
  .brand b { font-size: 14px; letter-spacing: -.01em; }
  .group {
    display: flex; align-items: center; gap: 5px;
    padding-right: 10px; border-right: 1px solid var(--line);
  }
  .group:last-of-type { border-right: none; padding-right: 0; }
  .swatch {
    width: 23px; height: 23px; border-radius: 50%;
    border: 2px solid var(--line-strong); cursor: pointer; padding: 0; transition: transform .12s ease;
  }
  .swatch:hover { transform: scale(1.08); }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--ink); border-color: transparent; }
  button.tool {
    font: inherit; font-size: 12.5px; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 10px;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    transition: background .12s ease, border-color .12s ease, transform .06s ease;
  }
  button.tool.icon { padding: 6px 7px; }
  button.tool:hover { border-color: var(--muted); }
  button.tool:active { transform: translateY(1px); }
  button.tool[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.tool.danger:hover { border-color: var(--accent); color: var(--accent); }
  button.tool svg { width: 15px; height: 15px; }
  .size {
    width: 29px; height: 29px; border-radius: 8px; border: 1px solid var(--line-strong);
    background: var(--panel); cursor: pointer; display: grid; place-items: center; padding: 0;
  }
  .size:hover { border-color: var(--muted); }
  .size[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .size i { display: block; border-radius: 50%; background: var(--ink); }
  .spacer { flex: 1; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 12.5px; color: var(--ink); }
  .toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .track { width: 34px; height: 20px; border-radius: 999px; background: var(--line-strong); position: relative; transition: background .16s ease; flex: none; }
  .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .16s ease; }
  .toggle input:checked + .track { background: var(--good); }
  .toggle input:checked + .track::after { transform: translateX(14px); }
  .toggle input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

  .stage { flex: 1; position: relative; padding: 0; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; background: var(--sheet); }

  .txt-editor {
    position: absolute; margin: 0; padding: 2px 4px; border: 1px solid var(--accent);
    border-radius: 4px; background: rgba(255,255,255,.94); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    line-height: 1.25; resize: none; overflow: hidden; outline: none;
    box-shadow: 0 2px 10px rgba(0,0,0,.15); white-space: pre; z-index: 10; transform-origin: top left;
  }

  .status {
    position: absolute; left: 16px; bottom: 16px; display: inline-flex; align-items: center;
    gap: 8px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px;
    letter-spacing: .02em; color: #8a9099; background: rgba(255,255,255,.85);
    backdrop-filter: blur(4px); padding: 5px 10px; border-radius: 7px;
    border: 1px solid rgba(20,23,28,.08); pointer-events: none; transition: color .2s ease, opacity .3s ease;
  }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: #c2c8d1; transition: background .2s ease; }
  .status.ok { color: var(--good); } .status.ok .dot { background: var(--good); }
  .status.err { color: var(--accent); } .status.err .dot { background: var(--accent); }

  .zoombar {
    position: absolute; right: 16px; bottom: 16px; display: inline-flex; align-items: center;
    background: var(--panel); border: 1px solid var(--line-strong); border-radius: 9px;
    box-shadow: var(--shadow); overflow: hidden; user-select: none;
  }
  .zoombar button {
    font: inherit; font-size: 13px; color: var(--ink); background: transparent; border: none;
    padding: 7px 11px; cursor: pointer; display: grid; place-items: center; min-width: 34px;
  }
  .zoombar button:hover { background: var(--bg); }
  .zoombar .sep { width: 1px; align-self: stretch; background: var(--line); }
  .zoombar #zoomreset { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; min-width: 52px; font-variant-numeric: tabular-nums; }

  .hint {
    position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
    text-align: center; color: #b3bac4; padding: 24px;
  }
  .hint b { display:block; font-size: 15px; color: #9aa2ad; font-weight: 600; margin-bottom: 6px; }
  .hint span { font-size: 12.5px; line-height: 1.7; }
  .hint kbd {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px;
    background: #f1f3f6; border: 1px solid #dfe3e9; border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 5px; color: #6b7280;
  }

  @media (max-width: 1040px) { .brand { display: none; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(function () {
  const canvas = document.getElementById("pad");
  const ctx = canvas.getContext("2d");
  const stage = canvas.parentElement;
  const hint = document.getElementById("hint");
  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("statustext");
  const fileInput = document.getElementById("fileinput");
  const zoomLabel = document.getElementById("zoomreset");
  const SHEET = "#ffffff";
  const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif';
  const MIN_SCALE = 0.08, MAX_SCALE = 12;
  const SHAPE_TOOLS = { rect: 1, ellipse: 1, line: 1, arrow: 1 };

  let dpr = 1, gridColor = "#d9dde3", accentColor = "#ff4d2e";
  const state = { tool: "pen", color: "#191d24", size: 6, autocopy: true };
  const view = { scale: 1, x: 0, y: 0 };   // world -> screen: p*scale + offset
  const items = [];
  let selection = [], editor = null, marquee = null;

  // ---------- transforms ----------
  function toWorld(sx, sy) { return { x: (sx - view.x) / view.scale, y: (sy - view.y) / view.scale }; }
  function toScreen(wx, wy) { return { x: wx * view.scale + view.x, y: wy * view.scale + view.y }; }
  function viewSize() { return { w: canvas.width / dpr, h: canvas.height / dpr }; }
  function viewCenterWorld() { const v = viewSize(); return toWorld(v.w / 2, v.h / 2); }

  // ---------- geometry ----------
  function measureText(it) {
    ctx.font = it.size + "px " + FONT;
    const lines = it.text.split("\n");
    let w = 0; for (const ln of lines) w = Math.max(w, ctx.measureText(ln || " ").width);
    it._w = Math.ceil(w) + 6; it._h = Math.ceil(lines.length * it.size * 1.25) + 4;
  }
  function selectable(it) { return it.type === "image" || it.type === "text" || it.type === "shape"; }
  function bounds(it) {
    if (it.type === "image") return { x: it.x, y: it.y, w: it.w, h: it.h };
    if (it.type === "text") { if (it._w == null) measureText(it); return { x: it.x, y: it.y, w: it._w, h: it._h }; }
    if (it.type === "shape") {
      if (it.kind === "line" || it.kind === "arrow")
        return { x: Math.min(it.x1, it.x2), y: Math.min(it.y1, it.y2), w: Math.abs(it.x2 - it.x1), h: Math.abs(it.y2 - it.y1) };
      return { x: it.x, y: it.y, w: it.w, h: it.h };
    }
    if (it.type === "stroke") {
      let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity, r = it.size / 2;
      for (const p of it.points) { a = Math.min(a, p.x - r); b = Math.min(b, p.y - r); c = Math.max(c, p.x + r); d = Math.max(d, p.y + r); }
      return { x: a, y: b, w: c - a, h: d - b };
    }
    return { x: 0, y: 0, w: 0, h: 0 };
  }
  function pointSeg(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy;
    let t = l2 ? ((px - x1) * dx + (py - y1) * dy) / l2 : 0; t = Math.max(0, Math.min(1, t));
    const cx = x1 + t * dx, cy = y1 + t * dy; return Math.hypot(px - cx, py - cy);
  }
  function hitItem(sx, sy) {
    const wp = toWorld(sx, sy);
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i]; if (!selectable(it)) continue;
      if (it.type === "shape" && (it.kind === "line" || it.kind === "arrow")) {
        const tol = 8 / view.scale + it.size;
        if (pointSeg(wp.x, wp.y, it.x1, it.y1, it.x2, it.y2) <= tol) return it;
      } else {
        const b = bounds(it);
        if (wp.x >= b.x && wp.x <= b.x + b.w && wp.y >= b.y && wp.y <= b.y + b.h) return it;
      }
    }
    return null;
  }
  // returns "br" for corner resize, "e1"/"e2" for endpoints, or null
  function handleAt(it, sx, sy) {
    if (it.type === "shape" && (it.kind === "line" || it.kind === "arrow")) {
      const a = toScreen(it.x1, it.y1), b = toScreen(it.x2, it.y2);
      if (Math.hypot(sx - a.x, sy - a.y) <= 12) return "e1";
      if (Math.hypot(sx - b.x, sy - b.y) <= 12) return "e2";
      return null;
    }
    const bx = bounds(it), h = toScreen(bx.x + bx.w, bx.y + bx.h);
    if (Math.abs(sx - h.x) <= 12 && Math.abs(sy - h.y) <= 12) return "br";
    return null;
  }

  // ---------- drawing ----------
  function drawStroke(g, s) {
    if (!s.points.length) return;
    g.save();
    if (s.highlight) { g.globalCompositeOperation = "multiply"; g.globalAlpha = 0.4; g.lineWidth = s.size * 3.2; }
    else g.lineWidth = s.size;
    g.strokeStyle = s.eraser ? SHEET : s.color; g.fillStyle = g.strokeStyle;
    g.lineJoin = "round"; g.lineCap = "round";
    if (s.points.length === 1) {
      const p = s.points[0]; g.beginPath(); g.arc(p.x, p.y, g.lineWidth / 2, 0, Math.PI * 2); g.fill();
    } else {
      g.beginPath(); g.moveTo(s.points[0].x, s.points[0].y);
      for (let i = 1; i < s.points.length - 1; i++) {
        const mx = (s.points[i].x + s.points[i + 1].x) / 2, my = (s.points[i].y + s.points[i + 1].y) / 2;
        g.quadraticCurveTo(s.points[i].x, s.points[i].y, mx, my);
      }
      const last = s.points[s.points.length - 1]; g.lineTo(last.x, last.y); g.stroke();
    }
    g.restore();
  }
  function drawShape(g, sh) {
    g.save();
    g.strokeStyle = sh.color; g.fillStyle = sh.color; g.lineWidth = sh.size;
    g.lineJoin = "round"; g.lineCap = "round";
    if (sh.kind === "rect") {
      const r = Math.min(6, Math.abs(sh.w) / 4, Math.abs(sh.h) / 4);
      g.beginPath();
      if (g.roundRect) g.roundRect(sh.x, sh.y, sh.w, sh.h, r); else g.rect(sh.x, sh.y, sh.w, sh.h);
      g.stroke();
    } else if (sh.kind === "ellipse") {
      g.beginPath(); g.ellipse(sh.x + sh.w / 2, sh.y + sh.h / 2, Math.abs(sh.w) / 2, Math.abs(sh.h) / 2, 0, 0, Math.PI * 2); g.stroke();
    } else if (sh.kind === "line" || sh.kind === "arrow") {

    if (!navigator.clipboard || !window.ClipboardItem) { copyFailed({ name: "unsupported" }); return; }
    const off = renderExport();
    const blobPromise = new Promise((res, rej) => off.toBlob((b) => b ? res(b) : rej(new Error("encode-failed")), "image/png"));
    try {
      navigator.clipboard.write([new ClipboardItem({ "image/png": blobPromise })])
        .then(() => setStatus("ok", auto ? "Copied ✓  paste into Claude with ⌘V" : "Copied ✓  ready to paste")).catch(copyFailed);
    } catch (err) { copyFailed(err); }
  }
  function copyFailed(err) { const name = (err && (err.name || err.message)) || "error"; setStatus("err", "Copy blocked (" + name + ") — use Save PNG instead"); }
  function savePng() {
    if (!items.length) { setStatus("neutral", "Nothing to save yet"); return; }
    renderExport().toBlob((b) => {
      if (!b) { setStatus("err", "Could not render image"); return; }
      const u = URL.createObjectURL(b), a = document.createElement("a"); a.href = u; a.download = "sketch.png";
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1500); setStatus("ok", "Saved sketch.png — drag it into Claude");
    }, "image/png");
  }
  function commit(auto) { render(); if (auto && state.autocopy) copyToClipboard(true); }

  // ---------- editing actions ----------
  function cloneItem(it) {
    const c = Object.assign({}, it); c._w = null;
    if (it.type === "stroke") c.points = it.points.map((p) => ({ x: p.x, y: p.y }));
    return c;
  }
  function duplicateSel() {
    if (!selection.length) return;
    const clones = selection.map(cloneItem); clones.forEach((c) => applyPos(c, snapPos(c), 16, 16));
    items.push(...clones); selection = clones; commit(true); setStatus("ok", "Duplicated");
  }
  function reorder(front) {
    if (!selection.length) return;
    const sel = new Set(selection), rest = items.filter((i) => !sel.has(i));
    items.length = 0; if (front) items.push(...rest, ...selection); else items.push(...selection, ...rest);
    commit(true); setStatus("neutral", front ? "Brought to front" : "Sent to back");
  }
  function deleteSel() { if (!selection.length) return; const sel = new Set(selection); for (let i = items.length - 1; i >= 0; i--) if (sel.has(items[i])) items.splice(i, 1); selection = []; commit(true); }

  // ---------- toolbar ----------
  function applyCursor() {
    const t = state.tool;
    canvas.style.cursor = t === "pen" || t === "highlight" || SHAPE_TOOLS[t] ? "crosshair" : t === "eraser" ? "cell" : t === "text" ? "text" : t === "hand" ? "grab" : "default";
  }
  function syncTools() {
    document.querySelectorAll("[data-tool]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.tool === state.tool));
    if (state.tool !== "select") selection = [];
  }
  function pickTool(t) { state.tool = t; syncTools(); applyCursor(); render(); }
  document.querySelectorAll("[data-tool]").forEach((b) => b.addEventListener("click", () => pickTool(b.dataset.tool)));
  document.querySelectorAll(".swatch").forEach((b) => b.addEventListener("click", () => {
    state.color = b.dataset.color;
    document.querySelectorAll(".swatch").forEach((s) => s.setAttribute("aria-pressed", s === b));
    let touched = false;
    for (const it of selection) if (it.type === "text" || it.type === "shape") { it.color = state.color; touched = true; }
    if (touched) commit(true);
  }));
  document.querySelectorAll(".size").forEach((b) => b.addEventListener("click", () => {
    state.size = Number(b.dataset.size);
    document.querySelectorAll(".size").forEach((s) => s.setAttribute("aria-pressed", s === b));
    let touched = false;
    for (const it of selection) if (it.type === "shape") { it.size = state.size; touched = true; }
    if (touched) commit(true);
  }));
  document.getElementById("dup").addEventListener("click", duplicateSel);
  document.getElementById("tofront").addEventListener("click", () => reorder(true));
  document.getElementById("toback").addEventListener("click", () => reorder(false));
  document.getElementById("undo").addEventListener("click", doUndo);
  function doUndo() {
    if (editor) { cancelEditor(); return; }
    items.pop(); selection = []; render();
    if (items.length && state.autocopy) copyToClipboard(true); else setStatus("neutral", items.length ? "Undid last item" : "Canvas is empty");
  }
  document.getElementById("clear").addEventListener("click", () => { items.length = 0; selection = []; render(); setStatus("neutral", "Cleared"); });
  const autoInput = document.getElementById("autocopy");
  autoInput.addEventListener("change", () => { state.autocopy = autoInput.checked; setStatus("neutral", state.autocopy ? "Auto-copy is on" : "Auto-copy is off"); });
  document.getElementById("copynow").addEventListener("click", () => copyToClipboard(false));
  document.getElementById("savepng").addEventListener("click", savePng);

  // ---------- keyboard ----------
  const TOOL_KEYS = { p: "pen", g: "highlight", t: "text", m: "select", h: "hand", e: "eraser", r: "rect", o: "ellipse", l: "line", a: "arrow" };
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" && !spaceDown) { const a = document.activeElement; if (!(a && a.classList.contains("txt-editor"))) { spaceDown = true; if (!mode) canvas.style.cursor = "grab"; } }
    if (document.activeElement && document.activeElement.classList.contains("txt-editor")) return;
    const meta = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
    if (meta && k === "z") { e.preventDefault(); doUndo(); }
    else if (meta && k === "c") { e.preventDefault(); copyToClipboard(false); }
    else if (meta && k === "d") { e.preventDefault(); duplicateSel(); }
    else if (meta && e.key === "]") { e.preventDefault(); reorder(true); }
    else if (meta && e.key === "[") { e.preventDefault(); reorder(false); }
    else if (meta && (e.key === "=" || e.key === "+")) { e.preventDefault(); const v = viewSize(); setScaleAt(v.w / 2, v.h / 2, view.scale * 1.25); }
    else if (meta && e.key === "-") { e.preventDefault(); const v = viewSize(); setScaleAt(v.w / 2, v.h / 2, view.scale / 1.25); }
    else if (meta && e.key === "0") { e.preventDefault(); const v = viewSize(); setScaleAt(v.w / 2, v.h / 2, 1); }
    else if ((e.key === "Delete" || e.key === "Backspace") && selection.length) { e.preventDefault(); deleteSel(); }
    else if (e.key === "Escape") { selection = []; render(); }
    else if (e.key === "1" && !meta) fitToContent();
    else if (!meta && TOOL_KEYS[k]) pickTool(TOOL_KEYS[k]);
  });
  window.addEventListener("keyup", (e) => { if (e.code === "Space") { spaceDown = false; if (!mode) applyCursor(); } });

  // ---------- init ----------
  window.addEventListener("resize", resize);
  if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { refreshColors(); render(); });
  refreshColors(); applyCursor(); updateZoomLabel(); resize();
})();
</script>
